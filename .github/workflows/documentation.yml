name: DocFx Git Page Deploy

on:
  push:
    branches:
      - alpha-release-pages
      - documentation/manual-first-pass
  workflow_dispatch:
jobs:
  # Build the documentation
  build:
    runs-on: windows-latest # Required by DocFX
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Install DocFX
        run: choco install -y docfx

      - name: Use README.md as index.md
        run: copy README.md Documentation\index.md
        shell: cmd

      - name: Build
        run: |
          cd Documentation
          docfx build
        shell: cmd

      # Upload the generated documentation
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: _site # This is the name of the artifact that is being uploaded.
          path: _site # Must equals the 'build.dest' value on your docfx.json

  # Deploy job
  deploy:
    # Add a dependency to the build job
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # or specific "vX.X.X" version tag for this action
        with: 
            artifact_name: _site
